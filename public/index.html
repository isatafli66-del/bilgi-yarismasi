<head>

    <style>
        html, body { width: 100%; height: 100%; }
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f2f2f2; margin: 0; height: 100vh; height: 100dvh; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
        .gizli { display: none !important; }
        
        #girisAlani { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #46178f; color: white; padding: 20px; }
        .logo { font-size: 40px; font-weight: bold; margin-bottom: 20px; }
        .giris-kutu { display: flex; flex-direction: column; width: 90%; max-width: 400px; gap: 10px; margin-bottom: 15px; }
        input { padding: 15px; font-size: 20px; border-radius: 4px; border: none; text-align: center; font-weight: bold; outline: none; box-sizing: border-box; width: 100%; }
        .satir-yatay { display: flex; gap: 10px; width: 100%; }
        .katil-btn { background: #26890c; color: white; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 4px; width: 100%; cursor: pointer; box-shadow: 0 4px 0 #185a07; }
        .qr-btn { background: #333; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40%; }
        
        #kameraAlan { background: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; width: 90%; max-width: 400px; color: #333; }
        #reader { width: 100%; }
        
        #oyunAlani { --mobil-fit: 1; flex: 1 1 auto; width: 100%; min-height: 0; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr); gap: calc(8px * var(--mobil-fit)); background: #f2f2f2; padding: calc(8px * var(--mobil-fit)); overflow: hidden; }
        #bilgiBar { min-width: 0; background: white; padding: calc(8px * var(--mobil-fit)) calc(10px * var(--mobil-fit)); border-radius: 8px; font-weight: bold; font-size: clamp(13px, calc(18px * var(--mobil-fit)), 18px); margin: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: 0.3s; display: grid; grid-template-columns: minmax(0, 1fr) minmax(64px, 110px) auto; align-items: center; gap: 8px; }
        .bilgi-zaman { min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #mobilSoruSayaci { background: #46178f; color: white; padding: calc(6px * var(--mobil-fit)) calc(10px * var(--mobil-fit)); border-radius: 999px; font-size: clamp(11px, calc(15px * var(--mobil-fit)), 15px); white-space: nowrap; }
        #mobilKalanSoru { font-size: 11px; opacity: 0.85; margin-left: 4px; }
        .mobil-kurum-logo-kutusu { box-sizing: border-box; display: flex; align-items: center; justify-content: center; overflow: hidden; background: white; border: 1px solid rgba(0,0,0,0.12); border-radius: 8px; box-shadow: 0 2px 7px rgba(0,0,0,0.14); }
        .mobil-kurum-logo-kutusu img { display: block; width: 100%; height: 100%; object-fit: contain; }
        #mobilKurumLogoKutusu { width: 100%; height: calc(36px * var(--mobil-fit)); min-height: 28px; padding: 3px 6px; justify-self: center; }
        .giris-kurum-logo-kutusu { width: min(58vw, 210px); height: 90px; padding: 8px 12px; margin: 0 auto 14px; }
        .sonuc-kurum-logo-kutusu { width: min(55%, 180px); height: 65px; padding: 6px 10px; margin: 0 auto 12px; }
        #soruBaslik { min-width: 0; max-height: min(18vh, 135px); box-sizing: border-box; overflow: hidden; overflow-wrap: anywhere; font-size: clamp(12px, calc(18px * var(--mobil-fit)), 18px); line-height: 1.18; font-weight: bold; margin: 0; padding: 0 calc(3px * var(--mobil-fit)); }
        #soruResmi { display: block; width: 100%; max-width: 100%; height: min(22vh, calc(155px * var(--mobil-fit))); min-height: 0; object-fit: contain; border-radius: 8px; margin: 0; }
        
        .cevap-grid { min-width: 0; min-height: 0; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: calc(8px * var(--mobil-fit)); margin: 0; overflow: hidden; }
        .btn { min-width: 0; min-height: 0; overflow: hidden; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-size: clamp(10px, calc(14px * var(--mobil-fit)), 14px); line-height: 1.16; box-shadow: 0 6px 0px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(10px * var(--mobil-fit)); gap: calc(7px * var(--mobil-fit)); }
        .btn-a { background: #e21b3c; } .btn-b { background: #1368ce; } .btn-c { background: #d89e00; } .btn-d { background: #26890c; }
        .btn.cevap-dogru { background: #16a34a !important; box-shadow: 0 6px 0 #0f6f32, 0 0 0 4px #fff; opacity: 1; }
        .btn.cevap-yanlis { background: #dc2626 !important; box-shadow: 0 6px 0 #991b1b; opacity: 0.82; }
        .btn.cevap-dogru::after { content: '✓ DOĞRU'; font-size: 13px; }
        .btn.cevap-yanlis::after { content: '✕ YANLIŞ'; font-size: 12px; }
        .btn:disabled { cursor: default; }
        .harf-ikon { width: calc(38px * var(--mobil-fit)); height: calc(38px * var(--mobil-fit)); min-width: 25px; min-height: 25px; flex-shrink: 0; background: white; color: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: clamp(15px, calc(23px * var(--mobil-fit)), 23px); font-weight: bold; box-shadow: 0 3px 5px rgba(0,0,0,0.3); }
        .cevap-metni { display: block; width: 100%; max-height: 100%; overflow: hidden; overflow-wrap: anywhere; line-height: 1.16; }
        #mesajAlani { grid-row: 2 / 5; align-self: center; margin: 0 !important; }

        #skorBord { background: white; color: #333; width: 90%; max-width: 400px; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin: 30px auto; }
        #skorListesi { list-style: none; padding: 0; margin: 0; }
        #skorListesi li { padding: 12px; font-size: 18px; font-weight: bold; border-bottom: 2px solid #eee; display: flex; justify-content: space-between; }
        
        #podyumEkrani { text-align: center; margin: 30px auto; width: 90%; max-width: 400px; }
        .kupa { font-size: 60px; margin-bottom: 10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-20px);} 60% {transform: translateY(-10px);} }
        #kazananlarListesi { font-size: 20px; font-weight: bold; margin-top: 20px; background: white; color: #333; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #podyumEkrani { max-height: calc(100dvh - 46px); overflow-y: auto; padding: 4px 4px 25px; }
        .kur-btn { background:rgba(255,255,255,.13); color:white; border:1px solid rgba(255,255,255,.45); padding:10px 14px; border-radius:999px; font-weight:800; cursor:pointer; margin:0 0 14px; }
        .son-oyun-btn { background:#fff; color:#46178f; border:0; padding:11px 14px; border-radius:7px; font-weight:800; cursor:pointer; box-shadow:0 3px 0 #d6d6d6; }
        #anaSayfaDurum { min-height:22px; margin:0 0 9px; font-size:14px; color:#f8e71c; font-weight:700; }
        #oyunMenuBtn { position:fixed; right:10px; bottom:42px; z-index:80; width:46px; height:46px; border-radius:50%; border:2px solid white; background:#46178f; color:white; font-size:23px; font-weight:900; box-shadow:0 5px 16px #0006; }
        #oyunMenu { position:fixed; inset:0; z-index:90; background:rgba(16,8,32,.58); display:flex; align-items:flex-end; justify-content:center; padding:12px; }
        .oyun-menu-karti { width:min(100%,420px); background:white; border-radius:18px; padding:18px; box-shadow:0 16px 45px #0007; color:#333; text-align:left; }
        .oyun-menu-karti h3 { margin:0 0 12px; color:#46178f; }
        .oyun-menu-karti button { width:100%; border:0; padding:13px; border-radius:9px; font-weight:800; margin-top:8px; }
        .menu-ana { background:#1368ce; color:white; } .menu-cik { background:#e21b3c; color:white; } .menu-kapat { background:#ececf2; color:#333; }
        #cevaplariGosterBtn { width:100%; margin-top:13px; border:0; padding:13px; border-radius:9px; background:#46178f; color:white; font-size:16px; font-weight:800; cursor:pointer; }
        #cevapDetaylari { margin-top:14px; text-align:left; }
        .sonuc-ozet { background:#fff; color:#333; border-radius:10px; padding:12px; margin-bottom:10px; box-shadow:0 3px 10px #0002; }
        .sonuc-ozet.dogru { border-left:7px solid #16a34a; } .sonuc-ozet.yanlis { border-left:7px solid #dc2626; } .sonuc-ozet.bos { border-left:7px solid #7f8c8d; }
        .sonuc-ozet strong { display:block; margin-bottom:7px; color:#46178f; }
        .sonuc-satir { font-size:13px; margin:3px 0; line-height:1.35; }

        #altImza { flex: 0 0 auto; padding: clamp(3px, 1vh, 8px); text-align: center; font-size: 11px; color: #888; display: flex; justify-content: center; align-items: center; gap: 6px; background: #f2f2f2; letter-spacing: 1px; }

        @media (max-height: 650px) {
            #oyunAlani { gap: 5px; padding: 5px; }
            #bilgiBar { padding: 7px 9px; }
            #soruBaslik { max-height: 14vh; }
            #soruResmi { height: min(17vh, calc(105px * var(--mobil-fit))); }
            .cevap-grid { gap: 6px; }
            .btn { padding: 6px; gap: 4px; }
            #altImza { padding: 2px; font-size: 9px; }
            #altImza img { height: 14px !important; }
        }

        @media (max-width: 380px) {
            #bilgiBar { grid-template-columns: minmax(0, 1fr) 76px auto; gap: 5px; }
            #mobilKurumLogoKutusu { padding: 2px 4px; }
            #mobilKalanSoru { display: none; }
        }

        @media (orientation: landscape) and (max-height: 600px) {
            #oyunAlani { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.65fr); grid-template-rows: auto auto minmax(0, 1fr); column-gap: 8px; }
            #bilgiBar { grid-column: 1 / -1; grid-row: 1; }
            #soruBaslik { grid-column: 1; grid-row: 2; max-height: 25vh; align-self: start; }
            #soruResmi { grid-column: 1; grid-row: 3; width: 100%; height: 100%; max-height: 100%; }
            .cevap-grid { grid-column: 2; grid-row: 2 / 4; }
            #mesajAlani { grid-column: 1 / -1; grid-row: 2 / 4; }
            #mobilKurumLogoKutusu { height: calc(30px * var(--mobil-fit)); min-height: 24px; }
        }
    </style>

<body>

    <div id="girisAlani">
        <div data-kurum-logo-kutusu class="mobil-kurum-logo-kutusu giris-kurum-logo-kutusu gizli"><img data-kurum-logo src="" alt="Kurum logosu"></div>
        <div class="logo">Bilgi Yarışması</div>
        <button id="pwaKurBtn" class="kur-btn">📲 Telefona Tazzy’yi Ekle</button>
        <div id="anaSayfaDurum"></div>
        
        <div id="kameraAlan" class="gizli">
            <h4 style="margin: 0 0 10px 0;">Kamerayı Dev Ekrana Tutun</h4>
            <div id="reader"></div>
            <button onclick="kapatScanner()" style="background: #e21b3c; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; margin-top: 10px; font-weight:bold;">İptal Et</button>
        </div>

            <div class="satir-yatay" id="pinKutusu">

    <div id="oyunAlani" class="gizli">
        <button id="oyunMenuBtn" type="button" aria-label="Oyun menüsünü aç">⋮</button>
        <div id="bilgiBar"><span class="bilgi-zaman"><span id="durumIkonu">⏳</span> <span id="sureMetni">0</span> <span id="sureEtiketi">saniye</span></span><div id="mobilKurumLogoKutusu" data-kurum-logo-kutusu class="mobil-kurum-logo-kutusu gizli"><img data-kurum-logo src="" alt="Kurum logosu"></div><span id="mobilSoruSayaci" class="gizli"><span id="mobilSoruSayaciMetni">0/0</span><span id="mobilKalanSoru"></span></span></div>
        <h3 id="soruBaslik">Sıradaki soru bekleniyor...</h3>

        <div id="cevapButonlari" class="cevap-grid gizli">
            <button class="btn btn-a" data-secenek="A" onclick="cevapVer('A')"><div class="harf-ikon">A</div><span class="cevap-metni" id="txtA"></span></button>
            <button class="btn btn-b" data-secenek="B" onclick="cevapVer('B')"><div class="harf-ikon">B</div><span class="cevap-metni" id="txtB"></span></button>
            <button class="btn btn-c" data-secenek="C" onclick="cevapVer('C')"><div class="harf-ikon">C</div><span class="cevap-metni" id="txtC"></span></button>
            <button class="btn btn-d" data-secenek="D" onclick="cevapVer('D')"><div class="harf-ikon">D</div><span class="cevap-metni" id="txtD"></span></button>

        <div id="mesajAlani" class="gizli" style="font-size: 20px; font-weight: bold; margin-top: 50px;"></div>

    <div id="oyunMenu" class="gizli" role="dialog" aria-modal="true">
        <div class="oyun-menu-karti"><h3>Tazzy Quiz Menüsü</h3><button class="menu-ana" onclick="anaSayfayaDon(false)">⌂ Ana Sayfaya Dön</button><button class="menu-cik" onclick="quizdenCik()">🚪 Quizden Çık</button><button class="menu-kapat" onclick="oyunMenusunuKapat()">Vazgeç</button></div>
    </div>

    <div id="skorBord" class="gizli">
        <div data-kurum-logo-kutusu class="mobil-kurum-logo-kutusu sonuc-kurum-logo-kutusu gizli"><img data-kurum-logo src="" alt="Kurum logosu"></div>
        <h3 style="text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0;">🏆 PUAN DURUMU</h3>
        <ul id="skorListesi"></ul>
    </div>

    <div id="podyumEkrani" class="gizli">
        <div data-kurum-logo-kutusu class="mobil-kurum-logo-kutusu sonuc-kurum-logo-kutusu gizli"><img data-kurum-logo src="" alt="Kurum logosu"></div>
        <div class="kupa">🏆</div><h2 style="font-size: 28px; margin: 0;">YARIŞMA BİTTİ!</h2>
        <div id="kazananlarListesi"></div>
        <button id="cevaplariGosterBtn" class="gizli" onclick="cevaplariGosterGizle()">📝 Cevaplarımı Görüntüle</button>
        <div id="cevapDetaylari" class="gizli"></div>
    </div>

    <div id="altImza">
        <span>DESIGNED BY</span>
        <img src="Tazzy Siyah.png" alt="Tazzy" style="height: 18px; opacity: 0.8;">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ autoConnect: false });
        let html5QrcodeScanner;
        let urlPin = null;
        let aktifOturumVar = false;
        let sonKisiselSonuc = null;
        let pwaKurulumIstegi = null;
        const oyuncuToken = localStorage.getItem('tazzyOyuncuToken') || (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(36).slice(2)}`);
        localStorage.setItem('tazzyOyuncuToken', oyuncuToken);

        function htmlGuvenli(deger) { const alan = document.createElement('div'); alan.textContent = String(deger ?? ''); return alan.innerHTML; }
        
        // Telefon kopmalarında odaya tekrar sızması için hafıza
        let sonKullaniciAd = localStorage.getItem('tazzySonOyuncuAdi');
        let sonKullaniciPin = localStorage.getItem('tazzySonOyunPini');
        let aktifSoru = null;

        if(sonKullaniciAd) document.getElementById('isimInput').value = sonKullaniciAd;
        if(sonKullaniciPin) {
            document.getElementById('pinInput').value = sonKullaniciPin;
            document.getElementById('sonOyunaDonBtn').classList.remove('gizli');
        }

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            pwaKurulumIstegi = event;
            document.getElementById('pwaKurBtn').classList.remove('gizli');
        });
        window.addEventListener('appinstalled', () => {
            pwaKurulumIstegi = null;
            document.getElementById('pwaKurBtn').classList.add('gizli');
            document.getElementById('anaSayfaDurum').textContent = '✅ Tazzy Quiz telefonuna eklendi.';
        });
        document.getElementById('pwaKurBtn').addEventListener('click', async () => {
            if(pwaKurulumIstegi) {
                pwaKurulumIstegi.prompt();
                await pwaKurulumIstegi.userChoice;
                pwaKurulumIstegi = null;
                return;
            }
            const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
            alert(ios ? 'iPhone’da Safari paylaşım simgesine dokunun ve “Ana Ekrana Ekle” seçeneğini seçin.' : 'Tarayıcı menüsünü açıp “Ana ekrana ekle” veya “Uygulamayı yükle” seçeneğini seçin.');
        });
        if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {}));

        const sesContext = new (window.AudioContext || window.webkitAudioContext)();
        const alkisSesi = new Audio('https://www.soundjay.com/human/sounds/applause-01.mp3');
        let sesAktif = false;

        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('pin')) {
            urlPin = urlParams.get('pin');
            sonKullaniciPin = urlPin;
            document.getElementById('pinInput').value = urlPin;
            document.getElementById('pinKutusu').style.display = 'none';
        }

        // --- SES FONKSİYONLARI ---
        function tickSesi(frekans = 800) { if (!sesAktif) return; const osc = sesContext.createOscillator(); const gain = sesContext.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(frekans, sesContext.currentTime); gain.gain.setValueAtTime(0.1, sesContext.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, sesContext.currentTime + 0.1); osc.connect(gain); gain.connect(sesContext.destination); osc.start(); osc.stop(sesContext.currentTime + 0.1); }
        function bitisSesi() { if (!sesAktif) return; const osc = sesContext.createOscillator(); const gain = sesContext.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, sesContext.currentTime); gain.gain.setValueAtTime(0.2, sesContext.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, sesContext.currentTime + 0.5); osc.connect(gain); gain.connect(sesContext.destination); osc.start(); osc.stop(sesContext.currentTime + 0.5); }
        function konfetiPatlat() { const sure = 4000; const bitisZamani = Date.now() + sure; (function animasyon() { confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#e21b3c', '#1368ce', '#d89e00', '#26890c'] }); confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#e21b3c', '#1368ce', '#d89e00', '#26890c'] }); if (Date.now() < bitisZamani) requestAnimationFrame(animasyon); }()); }

        function tumEkranlariGizle() { document.getElementById('girisAlani').classList.add('gizli'); document.getElementById('oyunAlani').classList.add('gizli'); document.getElementById('skorBord').classList.add('gizli'); document.getElementById('podyumEkrani').classList.add('gizli'); alkisSesi.pause(); alkisSesi.currentTime = 0; }

        let mobilSigdirmaKaresi = null;
        function mobilMetniKutuyaSigdir(element, minimumBoyut) {
            if(!element || element.clientHeight === 0 || element.clientWidth === 0) return;
            element.style.fontSize = '';
            let boyut = parseFloat(getComputedStyle(element).fontSize);
            let deneme = 0;
            while((element.scrollHeight > element.clientHeight + 1 || element.scrollWidth > element.clientWidth + 1) && boyut > minimumBoyut && deneme < 24) {
                boyut -= 0.5;
                element.style.fontSize = `${boyut}px`;
                deneme += 1;
            }
        }

        function mobilEkranaSigdir() {
            if(mobilSigdirmaKaresi) cancelAnimationFrame(mobilSigdirmaKaresi);
            mobilSigdirmaKaresi = requestAnimationFrame(() => {
                const oyun = document.getElementById('oyunAlani');
                if(!oyun || oyun.classList.contains('gizli')) return;

                oyun.style.setProperty('--mobil-fit', '1');
                document.getElementById('soruBaslik').style.fontSize = '';
                document.querySelectorAll('#cevapButonlari .cevap-metni').forEach(metin => metin.style.fontSize = '');

                const tasiyor = () => {
                    if(oyun.scrollHeight > oyun.clientHeight + 1 || oyun.scrollWidth > oyun.clientWidth + 1) return true;
                    if(document.getElementById('soruBaslik').scrollHeight > document.getElementById('soruBaslik').clientHeight + 1) return true;
                    return Array.from(document.querySelectorAll('#cevapButonlari .btn')).some(btn => btn.scrollHeight > btn.clientHeight + 1 || btn.scrollWidth > btn.clientWidth + 1);
                };

                let olcek = 1;
                for(let i = 0; i < 8 && tasiyor(); i += 1) {
                    olcek = Math.max(0.58, olcek - 0.06);
                    oyun.style.setProperty('--mobil-fit', olcek.toFixed(2));
                }

                mobilMetniKutuyaSigdir(document.getElementById('soruBaslik'), 11);
                document.querySelectorAll('#cevapButonlari .cevap-metni').forEach(metin => mobilMetniKutuyaSigdir(metin, 9));
            });
        }

        window.addEventListener('resize', mobilEkranaSigdir);
        window.addEventListener('orientationchange', mobilEkranaSigdir);
        if(window.visualViewport) window.visualViewport.addEventListener('resize', mobilEkranaSigdir);

        function acScanner() { document.getElementById('kameraAlan').classList.remove('gizli'); html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false); html5QrcodeScanner.render(onScanSuccess, onScanFailure); }
        function kapatScanner() { if(html5QrcodeScanner) html5QrcodeScanner.clear(); document.getElementById('kameraAlan').classList.add('gizli'); }
        function onScanSuccess(decodedText) { try { let url = new URL(decodedText); let scannedPin = url.searchParams.get('pin'); if(scannedPin) { document.getElementById('pinInput').value = scannedPin; document.getElementById('pinKutusu').style.display = 'none'; kapatScanner(); alert("✅ QR Kod Okundu! Adınızı girip katılabilirsiniz."); } } catch(e) {} }
        function onScanFailure(error) {}

        function kurumLogolariniGuncelle(logoVerisi) {
            document.querySelectorAll('[data-kurum-logo-kutusu]').forEach(kutu => {
                const resim = kutu.querySelector('[data-kurum-logo]');
                if(!logoVerisi) {
                    kutu.classList.add('gizli');
                    resim.removeAttribute('src');
                    return;
                }

                resim.onload = () => { kutu.classList.remove('gizli'); mobilEkranaSigdir(); };
                resim.onerror = () => { kutu.classList.add('gizli'); resim.removeAttribute('src'); mobilEkranaSigdir(); };
                resim.src = logoVerisi;
            });
        }

        socket.on('ayarlar_guncelle', (ayarlar) => kurumLogolariniGuncelle(ayarlar?.logo));

        function oyunMenusunuAc() { document.getElementById('oyunMenu').classList.remove('gizli'); }
        function oyunMenusunuKapat() { document.getElementById('oyunMenu').classList.add('gizli'); }
        document.getElementById('oyunMenuBtn').addEventListener('click', oyunMenusunuAc);

        function sonOyunButonunuGuncelle() {
            document.getElementById('sonOyunaDonBtn').classList.toggle('gizli', !(sonKullaniciAd && sonKullaniciPin));
        }

        function oyunaKatil(isim, pin) {
            if(!isim || !pin) { alert("Lütfen adınızı ve oyun PIN'ini girin."); return; }
            sonKullaniciAd = isim;
            sonKullaniciPin = pin;
            aktifOturumVar = true;
            localStorage.setItem('tazzySonOyuncuAdi', isim);
            localStorage.setItem('tazzySonOyunPini', pin);
            sonOyunButonunuGuncelle();
            socket.emit('oyuncu_katil', { isim, pin, oyuncuToken });
        }

        function anaSayfayaDon(hafizayiTemizle) {
            if(aktifOturumVar) socket.emit(hafizayiTemizle ? 'oyuncu_ayril' : 'oyuncu_ana_sayfa');
            aktifOturumVar = false;
            aktifSoru = null;
            sonKisiselSonuc = null;
            oyunMenusunuKapat();
            tumEkranlariGizle();
            document.getElementById('girisAlani').classList.remove('gizli');
            document.getElementById('pinKutusu').style.display = '';
            document.getElementById('anaSayfaDurum').textContent = hafizayiTemizle ? 'Quiz bağlantısından çıkıldı.' : 'Ana sayfaya döndün. Son oyuna tek dokunuşla yeniden katılabilirsin.';
            if(hafizayiTemizle) {
                sonKullaniciAd = null;
                sonKullaniciPin = null;
                localStorage.removeItem('tazzySonOyuncuAdi');
                localStorage.removeItem('tazzySonOyunPini');
                document.getElementById('isimInput').value = '';
                document.getElementById('pinInput').value = '';
            } else {
                document.getElementById('isimInput').value = sonKullaniciAd || '';
                document.getElementById('pinInput').value = sonKullaniciPin || '';
            }
            urlPin = null;
            history.replaceState({}, '', window.location.pathname);
            sonOyunButonunuGuncelle();
        }

        async function quizdenCik() {
            if(await window.tazzyOnay('Quizden çıkmak istediğine emin misin? Oyuncu kaydın bu oturumdan kaldırılacak.')) anaSayfayaDon(true);
        }

        document.getElementById('sonOyunaDonBtn').addEventListener('click', () => oyunaKatil(sonKullaniciAd, sonKullaniciPin));
        
        document.getElementById('katilBtn').addEventListener('click', () => {
            const isim = document.getElementById('isimInput').value.trim();
            const pin = document.getElementById('pinInput').value.trim();
            
            sesAktif = true; if(sesContext.state === 'suspended') sesContext.resume();
            alkisSesi.volume = 0; alkisSesi.play().then(() => { alkisSesi.pause(); alkisSesi.currentTime = 0; alkisSesi.volume = 1; }).catch(e => console.log(e));

            oyunaKatil(isim, pin);
        });

        // Telefonun interneti koparsa otomatik odaya geri al!
        socket.on('connect', () => {
            if(aktifOturumVar && sonKullaniciAd && sonKullaniciPin) {
                socket.emit('oyuncu_katil', { isim: sonKullaniciAd, pin: sonKullaniciPin, oyuncuToken });
            }
        });
        
        socket.on('katilma_basarili', () => { aktifOturumVar = true; document.getElementById('anaSayfaDurum').textContent = ''; tumEkranlariGizle(); document.getElementById('oyunAlani').classList.remove('gizli'); gosterMesaj("✅ Bağlandın! Ekrana bak... 👀"); });
        socket.on('katilma_hatasi', (hataMsg) => { aktifOturumVar = false; alert("❌ " + hataMsg); if(!urlPin) document.getElementById('pinInput').value = ""; });

        function gosterMesaj(metin) { document.getElementById('cevapButonlari').classList.add('gizli'); document.getElementById('soruBaslik').innerText = ""; document.getElementById('soruResmi').classList.add('gizli'); const msg = document.getElementById('mesajAlani'); msg.innerText = metin; msg.classList.remove('gizli'); document.getElementById('bilgiBar').style.background = 'white'; document.getElementById('bilgiBar').style.color = 'black'; mobilEkranaSigdir(); }

        socket.on('yeni_soru', (gelenSoru) => {
            tumEkranlariGizle(); document.getElementById('oyunAlani').classList.remove('gizli'); document.getElementById('mesajAlani').classList.add('gizli');
            document.getElementById('bilgiBar').style.background = 'white'; document.getElementById('bilgiBar').style.color = 'black';
            aktifSoru = gelenSoru;
            document.getElementById('durumIkonu').innerText = '⏳'; document.getElementById('sureEtiketi').innerText = 'saniye';
            const sayac = document.getElementById('mobilSoruSayaci'); sayac.classList.remove('gizli'); document.getElementById('mobilSoruSayaciMetni').innerText = `${gelenSoru.soruNo || 1}/${gelenSoru.toplamSoru || 1}`; document.getElementById('mobilKalanSoru').innerText = `• ${Math.max(Number(gelenSoru.kalanSoru) || 0, 0)} kaldı`;
            document.getElementById('soruBaslik').innerText = gelenSoru.soru;
            const resim = document.getElementById('soruResmi'); resim.onload = mobilEkranaSigdir; resim.onerror = mobilEkranaSigdir; if(gelenSoru.gorsel) { resim.src = gelenSoru.gorsel; resim.classList.remove('gizli'); } else { resim.removeAttribute('src'); resim.classList.add('gizli'); }
            document.getElementById('txtA').innerText = gelenSoru.secenekler.A; document.getElementById('txtB').innerText = gelenSoru.secenekler.B; document.getElementById('txtC').innerText = gelenSoru.secenekler.C; document.getElementById('txtD').innerText = gelenSoru.secenekler.D;
            document.querySelectorAll('#cevapButonlari .btn').forEach(btn => { btn.disabled = false; btn.classList.remove('cevap-dogru', 'cevap-yanlis'); });
            document.getElementById('cevapButonlari').classList.remove('gizli');
            mobilEkranaSigdir();
        });

        socket.on('cevap_yansit', (bilgi) => {
            const dogruCevap = typeof bilgi === 'string' ? bilgi : bilgi?.dogruCevap;
            if(!dogruCevap || !aktifSoru) return;
            tumEkranlariGizle(); document.getElementById('oyunAlani').classList.remove('gizli'); document.getElementById('mesajAlani').classList.add('gizli');
            document.getElementById('bilgiBar').style.background = 'white'; document.getElementById('bilgiBar').style.color = 'black'; document.getElementById('durumIkonu').innerText = '✅'; document.getElementById('sureMetni').innerText = ''; document.getElementById('sureEtiketi').innerText = 'Cevap Yansıtıldı';
            document.getElementById('soruBaslik').innerText = aktifSoru.soru;
            const resim = document.getElementById('soruResmi'); resim.onload = mobilEkranaSigdir; resim.onerror = mobilEkranaSigdir; if(aktifSoru.gorsel) { resim.src = aktifSoru.gorsel; resim.classList.remove('gizli'); } else { resim.removeAttribute('src'); resim.classList.add('gizli'); }
            document.getElementById('cevapButonlari').classList.remove('gizli');
            document.querySelectorAll('#cevapButonlari .btn').forEach(btn => { const dogruMu = btn.dataset.secenek === dogruCevap; btn.disabled = true; btn.classList.toggle('cevap-dogru', dogruMu); btn.classList.toggle('cevap-yanlis', !dogruMu); });
            mobilEkranaSigdir();
        });

        socket.on('zaman_guncelle', (kalanSaniye) => { 
            document.getElementById('sureMetni').innerText = kalanSaniye; 
            if (kalanSaniye > 0 && !document.getElementById('oyunAlani').classList.contains('gizli') && !document.getElementById('cevapButonlari').classList.contains('gizli')) {
                if (kalanSaniye <= 3) { document.getElementById('bilgiBar').style.background = '#e21b3c'; document.getElementById('bilgiBar').style.color = 'white'; tickSesi(1200); } else { tickSesi(800); }
            }
        });

        socket.on('sure_bitti', () => { bitisSesi(); gosterMesaj("Süre Doldu! Diğer soruyu bekleyin... ⏳"); });

        socket.on('puan_guncelle', (oyuncular) => {
            const liste = document.getElementById('skorListesi'); liste.innerHTML = "";
            oyuncular.sort((a, b) => b.puan - a.puan);
            oyuncular.slice(0, 5).forEach((oyuncu) => { liste.innerHTML += `<li><span>👤 ${htmlGuvenli(oyuncu.isim)}</span> <span style="color:#26890c;">${Number(oyuncu.puan) || 0} Puan</span></li>`; });
        });

        socket.on('skor_tablosunu_goster', () => { tumEkranlariGizle(); document.getElementById('skorBord').classList.remove('gizli'); document.body.style.background = '#f2f2f2'; });
        socket.on('quiz_bitti_bekle', () => { tumEkranlariGizle(); document.getElementById('oyunAlani').classList.remove('gizli'); gosterMesaj("Yarışma tamamlandı! Sonuçlar ekrana yansıtılacak... 🎊"); });

        socket.on('quiz_bitti_final', (oyuncular) => {
            tumEkranlariGizle(); document.getElementById('podyumEkrani').classList.remove('gizli');
            if(sesAktif) alkisSesi.play(); konfetiPatlat();
            oyuncular.sort((a, b) => b.puan - a.puan);
            const kazananlarDiv = document.getElementById('kazananlarListesi'); kazananlarDiv.innerHTML = "";
            if(oyuncular[0]) kazananlarDiv.innerHTML += `<div style=\"font-size: 26px; color:#d89e00; margin-bottom:10px;\">🥇 1. ${htmlGuvenli(oyuncular[0].isim)}<br><small>${Number(oyuncular[0].puan) || 0} Puan</small></div>`;
            if(oyuncular[1]) kazananlarDiv.innerHTML += `<div style=\"font-size: 20px; color:#7f8c8d; margin-bottom:10px;\">🥈 2. ${htmlGuvenli(oyuncular[1].isim)} (${Number(oyuncular[1].puan) || 0})</div>`;
            if(oyuncular[2]) kazananlarDiv.innerHTML += `<div style=\"font-size: 18px; color:#cd7f32;\">🥉 3. ${htmlGuvenli(oyuncular[2].isim)} (${Number(oyuncular[2].puan) || 0})</div>`;
            document.getElementById('cevapDetaylari').classList.add('gizli');
            document.getElementById('cevaplariGosterBtn').classList.toggle('gizli', !sonKisiselSonuc);
        });

        socket.on('oyuncu_sonuc', (sonuc) => {
            sonKisiselSonuc = sonuc;
            const buton = document.getElementById('cevaplariGosterBtn');
            if(sonuc && !document.getElementById('podyumEkrani').classList.contains('gizli')) buton.classList.remove('gizli');
        });

        function cevaplariGosterGizle() {
            const alan = document.getElementById('cevapDetaylari');
            const aciliyor = alan.classList.contains('gizli');
            alan.classList.toggle('gizli', !aciliyor);
            document.getElementById('cevaplariGosterBtn').textContent = aciliyor ? '▲ Cevaplarımı Kapat' : '📝 Cevaplarımı Görüntüle';
            if(!aciliyor || !sonKisiselSonuc) return;
            alan.innerHTML = `<div style="text-align:center;color:#333;margin:8px 0 12px"><strong>${htmlGuvenli(sonKisiselSonuc.oyuncu?.isim)}</strong> · ${Number(sonKisiselSonuc.oyuncu?.puan) || 0} puan</div>` + sonKisiselSonuc.cevaplar.map(cevap => {
                const durum = !cevap.secim ? 'bos' : cevap.dogruMu ? 'dogru' : 'yanlis';
                const durumMetni = !cevap.secim ? '○ Boş bırakıldı' : cevap.dogruMu ? '✓ Doğru' : '✕ Yanlış';
                const verilen = cevap.secim ? `${cevap.secim}) ${cevap.secenekler?.[cevap.secim] || ''}` : 'Cevap verilmedi';
                const dogru = `${cevap.dogruCevap}) ${cevap.secenekler?.[cevap.dogruCevap] || ''}`;
                return `<div class="sonuc-ozet ${durum}"><strong>${cevap.soruNo}. ${htmlGuvenli(cevap.soru)}</strong><div class="sonuc-satir">${durumMetni}</div><div class="sonuc-satir">Senin cevabın: ${htmlGuvenli(verilen)}</div><div class="sonuc-satir">Doğru cevap: ${htmlGuvenli(dogru)}</div></div>`;
            }).join('');
        }

        socket.on('quiz_sonlandirildi', (bilgi) => {
            aktifOturumVar = false;
            aktifSoru = null;
            sonKisiselSonuc = null;
            sonKullaniciPin = null;
            localStorage.removeItem('tazzySonOyunPini');
            oyunMenusunuKapat();
            tumEkranlariGizle();
            document.getElementById('girisAlani').classList.remove('gizli');
            document.getElementById('pinKutusu').style.display = '';
            document.getElementById('pinInput').value = '';
            document.getElementById('anaSayfaDurum').textContent = bilgi?.mesaj || 'Quiz sona erdi. Yeni oyun için PIN bekleniyor.';
            urlPin = null;
            history.replaceState({}, '', window.location.pathname);
            sonOyunButonunuGuncelle();
        });

        function cevapVer(secenek) {
            document.querySelectorAll('#cevapButonlari .btn').forEach(btn => btn.disabled = true);
            socket.emit('cevap_gonder', secenek);
            gosterMesaj("Cevabın alındı! Bekleniyor...");
        }
        socket.on('cevap_reddedildi', (mesaj) => gosterMesaj(mesaj || 'Cevabın daha önce kaydedildi.'));
    </script>
    <script src="/v140-common.js"></script>
    <script>socket.connect();</script>
</body>
</html>
